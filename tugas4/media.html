!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media dan Layout</title>
    <link rel="icon" type="image/x-icon" href="assets/Logo PeTIK.jpeg">
</head>
<body align="center" >
    <!-- tag image -->
     <h4 style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">MBG</h4>
    <img style="border-radius: 8px; " style="padding: 30;" style="box-shadow: inset;" src="assets/Park Eun Bin.jpg" alt="" width="300" height="200" >
    <hr>
    <!-- tag audio -->
     <h4 style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">part mussic</h4>
     <audio controls>
        <source src="assets/ssstik.io_1793236941360.mp3">
     </audio>
     <hr>
     <!-- tag vidio -->
      <h4 style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">cinematic</h4>
      <video style="border-radius: 8px; " style="padding: 30;" style="box-shadow: inset;" width="480" controls>
        <source src="assets/cinematic.mp4">
      </video>
      <hr><br>
      <!-- tag embed/iframe -->
       <h4 style="border-radius: 8px; " style="padding: 30;" style="box-shadow: inset;" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">🎬 Series : Can This Love Be Translated
           🎵 Song : About You — The 1975</h4>
       <iframe width="560" height="315" src="https://www.youtube.com/embed/a2zZzAr1e_c?si=vLXalqJA7BBb9kOa" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
