<form>
    <h1 align="center" style="margin: 3%;">Form Peminjaman Buku Perpustakaan</h1>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text" class="col-2 col-form-label">Nama Lengkap</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-book"></i>
          </div>
        </div> 
        <input id="text" name="text" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text1" class="col-2 col-form-label">Nim</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-card"></i>
          </div>
        </div> 
        <input id="text1" name="text1" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text2" class="col-2 col-form-label">Jurusan</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-book-o"></i>
          </div>
        </div> 
        <input id="text2" name="text2" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="select" class="col-2 col-form-label">Judul buku</label> 
    <div class="col-8">
      <select id="select" name="select" class="custom-select">
        <option value="ttr">Tutorial 10m dalam 1tahun</option>
        <option value="ss">Sukses di umur 12thn</option>
        <option value="rk">Ryo kintaro sukses muda</option>
      </select>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label class="col-2">Batas Pengembalian</label> 
    <div class="col-8">
      <div class="custom-control custom-radio custom-control-inline">
        <input name="radio" id="radio_0" type="radio" class="custom-control-input" value="rabbit"> 
        <label for="radio_0" class="custom-control-label">1Hari</label>
      </div>
      <div class="custom-control custom-radio custom-control-inline">
        <input name="radio" id="radio_1" type="radio" class="custom-control-input" value="duck"> 
        <label for="radio_1" class="custom-control-label">2Hari</label>
      </div>
      <div class="custom-control custom-radio custom-control-inline">
        <input name="radio" id="radio_2" type="radio" class="custom-control-input" value="fish"> 
        <label for="radio_2" class="custom-control-label">Maks3Hari</label>
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label class="col-2">Kondisi Buku waktu peminjaman</label> 
    <div class="col-8">
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_0" type="checkbox" class="custom-control-input" value="rabbit"> 
        <label for="checkbox_0" class="custom-control-label">Baik</label>
      </div>
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_1" type="checkbox" class="custom-control-input" value="duck"> 
        <label for="checkbox_1" class="custom-control-label">Rusak</label>
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="textarea" class="col-2 col-form-label">Pesan&Kesan</label> 
    <div class="col-8">
      <textarea id="textarea" name="textarea" cols="40" rows="5" class="form-control"></textarea>
    </div>
  </div> 
  <div class="form-group row" style="padding-left: 5%;">
    <div class="offset-4 col-8">
      <button name="submit" type="submit" class="btn btn-primary">Submit</button>
    </div>
  </div>
</form>
